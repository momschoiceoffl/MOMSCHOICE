<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Product | Mom's Choice</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14050B">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- [SIDEBAR]                                                   -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <strong data-i18n="store_name">Mom's Choice</strong>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link">
        <img class="nav-icon" src="assets/icons/home.svg" alt="">
        <span data-i18n="home">Home</span>
      </a>
      <a href="#" class="sidebar-link" id="sidebarCategoriesToggle" onclick="toggleSidebarCategories(event)">
        <img class="nav-icon" src="assets/icons/categories.svg" alt="">
        <span data-i18n="categories">Categories</span>
      </a>
      <div class="sidebar-subnav" id="sidebarSubnav" style="display: none;"></div>

      <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;"></div>

      <a href="#" class="sidebar-link" onclick="openFavsModal()">
        <img class="nav-icon" src="assets/icons/heart.svg" alt="">
        <span data-i18n="favorites">Favorites</span>
      </a>
      <a href="#" class="sidebar-link" onclick="openWishModal()">
        <img class="nav-icon" src="assets/icons/bookmark.svg" alt="">
        <span data-i18n="wishlist">Wishlist</span>
      </a>
      <a href="#" class="sidebar-link" onclick="shareStore()">
        <img class="nav-icon" src="assets/icons/share.svg" alt="">
        <span data-i18n="share_store">Share Store</span>
      </a>
    </nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- [HEADER] Product Detail                                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <header class="pd-header">
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
    <button class="pd-back" id="pdBackBtn" data-i18n="back">← Back</button>
    <h1 id="pdHeaderTitle">Product</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <div style="display: flex; background: rgba(0,0,0,0.4); border: 1px solid var(--border-gold); border-radius: 16px; overflow: hidden;">
        <button onclick="setLanguage('en')" id="btnLangEn" style="font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border: none; cursor: pointer;">EN</button>
        <button onclick="setLanguage('ta')" id="btnLangTa" style="font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border: none; cursor: pointer;">தமிழ்</button>
      </div>
      <button class="cart-trigger" id="cartOpenBtn" aria-label="Shopping Cart">
        <img src="assets/icons/cart.svg" width="18" height="18" alt="">
        <span class="cart-counter" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- [MAIN] Product Detail                                       -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <main class="pd-container" style="padding-top: 55px;">

    <section class="pd-gallery-wrap">
      <div class="pd-gallery" id="pdGallery"></div>
      <div class="pd-thumbs" id="pdThumbs"></div>
    </section>

    <section class="pd-info">
      <h2 id="pdTitle">—</h2>
      <div class="pd-price-row">
        <span class="pd-price" id="pdPrice">₹0</span>
        <span class="pd-mrp" id="pdMrp">₹0</span>
        <span class="pd-tag" id="pdTag" style="display:none;"></span>
      </div>

      <div class="product-actions-row" style="margin-bottom: 16px;">
        <button class="action-icon-btn fav-btn" id="pdFavBtn" title="Favorite">
          <img src="assets/icons/heart.svg" alt="">
        </button>
        <button class="action-icon-btn wish-btn" id="pdWishBtn" title="Wishlist">
          <img src="assets/icons/bookmark.svg" alt="">
        </button>
        <button class="action-icon-btn" id="pdShareBtn" title="Share">
          <img src="assets/icons/share.svg" alt="">
        </button>
      </div>

      <p class="pd-desc" id="pdDesc"></p>
    </section>

    <section class="pd-also" id="pdAlso" style="display:none;">
      <h3 data-i18n="you_may_also_like">You may also like</h3>
      <div class="pd-also-grid" id="pdAlsoGrid"></div>
    </section>

    <div style="height:80px;"></div>
  </main>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- [BOTTOM BAR] Add to Cart / WhatsApp                         -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div class="pd-bottom-bar">
    <button class="pd-btn-add" id="pdAddBtn" data-i18n="add_to_cart">🛒 Add to Cart</button>
    <button class="pd-btn-wa" id="pdWaBtn" data-i18n="send_wa">📲 Send Order on WhatsApp</button>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- [CART DRAWER]                                               -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div class="cart-overlay" id="cartOverlay">
    <aside class="cart-drawer">
      <div class="cart-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h3 data-i18n="shopping_bag" style="margin: 0;">Your Shopping Bag</h3>
        <button class="close-btn" id="cartCloseBtn" aria-label="Close cart" style="display: flex !important; background: #6B0F2E; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; align-items: center; gap: 6px; cursor: pointer; z-index: 9999;">
          <img src="assets/icons/close.svg" width="18" height="18" alt="" style="filter: brightness(0) invert(1);"> Close
        </button>
      </div>

      <div class="cart-body" id="cartItemsList">
        <p class="empty-msg" data-i18n="empty_bag">Your shopping bag is empty.</p>
      </div>

      <button onclick="document.getElementById('cartOverlay').classList.remove('open')" style="position: absolute; bottom: 20px; left: 20px; background: #6B0F2E; color: #fff; border: 2px solid #D9A08B; padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer; z-index: 99999; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.8);">
        ✕ Close Cart
      </button>
      <div class="cart-footer">
        <div class="cart-total-row"><span data-i18n="subtotal">Subtotal</span><strong id="cartTotalDisplay">₹0</strong></div>
        <div class="checkout-fields">
          <input type="text" id="custName" placeholder="Your Full Name" data-i18n="full_name" required>
          <input type="tel" id="custPhone" placeholder="Mobile / WhatsApp Number" data-i18n="phone" required>
          <textarea id="custAddress" placeholder="Full Delivery Address with Pincode" data-i18n="address" rows="2" required></textarea>
        </div>
        <button class="btn-checkout" id="checkoutBtn" data-i18n="proceed_pay">Proceed to Pay & WhatsApp Order</button>
      </div>
    </aside>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- [SCRIPTS]                                                   -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div class="login-modal-overlay" id="favsModal">
    <div class="login-card" style="max-width:90%;width:500px;text-align:left; position: relative;">
      <button class="close-btn" onclick="document.getElementById('favsModal').classList.remove('open')" style="position:absolute; top:16px; right:16px; cursor:pointer; background:none; border:none;">
        <img src="assets/icons/close.svg" width="20" height="20" alt="">
      </button>
      <h2 id="favsModalTitle" style="margin-bottom:12px;">My Items</h2>
      <div id="favsModalList" style="max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;"></div>
    </div>
  </div>

  <script src="assets/js/translations.js"></script>
  <script src="assets/js/product.js"></script>
</body>
</html>
