<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Category | Mom's Choice</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14050B">
</head>
<body>

  <!-- [SIDEBAR] -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <strong data-i18n="store_name">Mom's Choice</strong>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;margin-right:8px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span data-i18n="home">Home</span>
      </a>
      <a href="#" class="sidebar-link active" id="sidebarCategoriesToggle" onclick="toggleSidebarCategories(event)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;margin-right:8px;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span data-i18n="categories">Categories</span>
      </a>
      <div class="sidebar-subnav" id="sidebarSubnav" style="display:none;"></div>
      <div style="border-top:1px solid rgba(255,255,255,0.1);margin:10px 0;"></div>
      <a href="#" class="sidebar-link" onclick="openFavsModal()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;margin-right:8px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span data-i18n="favorites">Favorites</span>
      </a>
      <a href="#" class="sidebar-link" onclick="openWishModal()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;margin-right:8px;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        <span data-i18n="wishlist">Wishlist</span>
      </a>
      <a href="#" class="sidebar-link" onclick="shareStore()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;margin-right:8px;"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        <span data-i18n="share_store">Share Store</span>
      </a>
    </nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- [HEADER] -->
  <header class="app-header">
    <div class="header-left-group">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
      <div class="brand">
        <img src="https://res.cloudinary.com/ft8zlz5x/image/upload/v1793235967/moms_pick/logo/MOMS%20CHOICE.png" alt="Mom's Choice" class="brand-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="logo-icon-fallback">✨</span>
        <div>
          <h1 id="catPageTitle">Category</h1>
          <small><span>Ethnic Wardrobe</span><span>Jewels &amp; Accessories</span></small>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <div class="header-stack">
        <div class="top-row">
          <div style="display:flex;background:rgba(0,0,0,0.4);border:1px solid var(--border-gold);border-radius:16px;overflow:hidden;">
            <button onclick="setLanguage('en')" id="btnLangEn" style="font-size:0.75rem;font-weight:700;padding:4px 10px;border:none;cursor:pointer;">EN</button>
            <button onclick="setLanguage('ta')" id="btnLangTa" style="font-size:0.75rem;font-weight:700;padding:4px 10px;border:none;cursor:pointer;">தமிழ்</button>
          </div>
        </div>
        <div class="bottom-row">
          <button class="icon-btn" id="searchToggle" aria-label="Search">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
          <button class="cart-trigger" id="cartOpenBtn" aria-label="Shopping Cart">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            <span class="cart-counter" id="cartCount">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- [SEARCH BAR] -->
  <div class="search-bar" id="searchBar">
    <input type="search" id="searchInput" placeholder="Search this category..." data-i18n="search_cat_placeholder" autocomplete="off">
    <button class="search-close" id="searchClose" style="font-size:1.2rem;color:var(--text-muted);">&times;</button>
  </div>

  <!-- [STICKY CHIPS] -->
  <div class="sticky-chips-wrap">
    <div class="sticky-inner">
      <button class="sub-btn back-btn" id="catBackBtn" onclick="window.location.href='index.html'">← Home</button>
      <div class="subcategory-bar" id="subcategoryBar"></div>
    </div>
  </div>

  <!-- [MAIN] -->
  <main class="container" style="padding-top:130px;">
    <section class="products-grid" id="productsContainer"></section>
  </main>

  <!-- [FOOTER] -->
  <footer class="app-footer">
    <div class="footer-socials">
      <a href="#" class="social-icon" data-social="whatsapp" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2z"/></svg></a>
      <a href="https://www.instagram.com/momschoiceoffl/" target="_blank" class="social-icon" data-social="instagram" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23C2.21 15.58 2.2 15.2 2.2 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.21 8.8 2.2 12 2.2z"/></svg></a>
      <a href="https://www.facebook.com/momschoiceoffl/" target="_blank" class="social-icon" data-social="facebook" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.9h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg></a>
      <a href="https://www.youtube.com/@momschoiceoffl" target="_blank" class="social-icon" data-social="youtube" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.5a3.02 3.02 0 00-2.12-2.14C19.5 3.85 12 3.85 12 3.85s-7.5 0-9.38.51A3.02 3.02 0 00.5 6.5C0 8.4 0 12 0 12s0 3.6.5 5.5a3.02 3.02 0 002.12 2.14c1.88.51 9.38.51 9.38.51s7.5 0 9.38-.51a3.02 3.02 0 002.12-2.14C24 15.6 24 12 24 12s0-3.6-.5-5.5zM9.6 15.6V8.4l6.24 3.6-6.24 3.6z"/></svg></a>
      <a href="https://www.meesho.com/momschoiceoffl" target="_blank" class="social-icon" data-social="meesho" aria-label="Meesho"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.5 14.5v-9l7 4.5-7 4.5z"/></svg></a>
      <a href="#" class="social-icon" data-social="email" aria-label="Email"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></a>
    </div>
    <div class="footer-copy">© Mom's Choice · A Mom's Choice Company</div>
  </footer>

  <!-- [CART DRAWER] -->
  <div class="cart-overlay" id="cartOverlay">
    <aside class="cart-drawer">
      <div class="cart-header" style="display:flex;justify-content:flex-start;align-items:center;gap:12px;">
        <button class="close-btn" id="cartCloseBtn" aria-label="Close cart" style="background:none;border:none;cursor:pointer;color:var(--gold-glow);">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3 data-i18n="shopping_bag" style="margin:0;">Your Shopping Bag</h3>
      </div>
      <div class="cart-body" id="cartItemsList">
        <p class="empty-msg" data-i18n="empty_bag">Your shopping bag is empty.</p>
      </div>
      <div class="cart-footer">
        <div class="cart-total-row"><span data-i18n="subtotal">Subtotal</span><strong id="cartSubtotalDisplay">₹0</strong></div>
        <div class="cart-total-row"><span data-i18n="shipping">Shipping</span><strong id="cartShippingDisplay">—</strong></div>
        <div class="cart-total-row grand"><span data-i18n="grand_total">Grand Total</span><strong id="cartTotalDisplay">₹0</strong></div>
        <div class="checkout-fields">
          <input type="text" id="custName" placeholder="Full Name" data-i18n="full_name" required>
          <input type="tel" id="custPhone" placeholder="WhatsApp Number" data-i18n="phone" required>
          <input type="text" id="custHouse" placeholder="Flat / House No / Street" data-i18n="house" required>
          <input type="text" id="custArea" placeholder="Area / Locality" data-i18n="area" required>
          <input type="text" id="custDistrict" placeholder="District" data-i18n="district" required>
          <input type="text" id="custState" placeholder="State" data-i18n="state" required>
          <input type="tel" id="custPincode" placeholder="Pincode (6 digits)" data-i18n="pincode" maxlength="6" pattern="[0-9]{6}">
          <label class="save-checkbox"><input type="checkbox" id="saveDetails"> <span data-i18n="save_details">Save details for next order</span></label>
        </div>
        <button class="btn-checkout" id="checkoutBtn" data-i18n="checkout_wa">📲 Send Order on WhatsApp</button>
      </div>
    </aside>
  </div>

  <!-- [FAVORITES / WISHLIST MODAL] -->
  <div class="login-modal-overlay" id="favsModal">
    <div class="login-card" style="max-width:90%;width:500px;text-align:left;">
      <button class="close-btn" onclick="document.getElementById('favsModal').classList.remove('open')" style="float:right;cursor:pointer;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <h2 id="favsModalTitle" style="margin-bottom:12px;">My Items</h2>
      <div id="favsModalList" style="max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;"></div>
    </div>
  </div>

  <!-- [SCRIPTS] -->
  <script src="assets/js/translations.js"></script>
  <script src="assets/js/category.js"></script>
</body>
</html>
