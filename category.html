
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Category | Mom's Choice</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d97706">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head"><span class="sidebar-logo">✨</span><strong>Mom's Choice</strong></div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link">
        <span class="nav-icon" aria-hidden="true" style="font-size: 1.1rem;">🏠</span> Home
      </a>
      <a href="#" class="sidebar-link active" id="sidebarCategoriesToggle" onclick="toggleSidebarCategories(event)">
        <span class="nav-icon" aria-hidden="true" style="font-size: 1.1rem;">🗂️</span> Categories
      </a>
      <div class="sidebar-subnav" id="sidebarSubnav" style="display: none;"></div>
      <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;"></div>
      <a href="#" class="sidebar-link" onclick="openFavsModal()">
        <span class="nav-icon" aria-hidden="true" style="font-size: 1.1rem;">❤</span> Favorites
      </a>
      <a href="#" class="sidebar-link" onclick="openWishModal()">
        <span class="nav-icon" aria-hidden="true" style="font-size: 1.1rem;">🔖</span> Wishlist
      </a>
      <a href="#" class="sidebar-link" onclick="shareStore()">
        <span class="nav-icon" aria-hidden="true" style="font-size: 1.1rem;">🔗</span> Share Store
      </a>
    </nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <header class="app-header">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div class="brand">
      <img src="https://res.cloudinary.com/ft8zlz5x/image/upload/v1793235967/moms_pick/logo/MOMS%20CHOICE.png" alt="Mom's Choice" class="brand-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span class="logo-icon-fallback">✨</span>
      <div>
        <h1 id="catPageTitle">Category</h1>
        <small>Ethnic Wardrobe · Jewels & Accessories</small>
      </div>
    </div>
    <div class="header-actions">
      <div class="header-stack">
        <div style="display: flex; gap: 8px; align-items: center;">
          <div style="display: flex; background: rgba(0,0,0,0.4); border: 1px solid var(--border-gold); border-radius: 16px; overflow: hidden;">
            <button onclick="setLanguage('en')" id="btnLangEn" style="font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border: none; cursor: pointer;">EN</button>
            <button onclick="setLanguage('ta')" id="btnLangTa" style="font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border: none; cursor: pointer;">தமிழ்</button>
          </div>
          <button class="cart-trigger" id="cartOpenBtn">🛒 <span class="cart-counter" id="cartCount">0</span></button>
        </div>
        <div class="icon-row" style="justify-content: flex-end;">
          <button class="icon-btn" id="searchToggle">🔍</button>
        </div>
      </div>
    </div>
  </header>

  <div class="search-bar" id="searchBar">
    <input type="search" id="searchInput" placeholder="Search this category..." data-i18n="search_cat_placeholder" autocomplete="off">
    <button class="search-close" id="searchClose">✕</button>
  </div>

  <!-- STICKY BACK BUTTON & SUBCATEGORY BAR -->
  <div class="sticky-chips-wrap">
    <div class="sticky-inner">
      <button class="sub-btn back-btn" id="catBackBtn" onclick="window.location.href='index.html'">← Home</button>
      <div class="subcategory-bar" id="subcategoryBar"></div>
    </div>
  </div>

  <main class="container" style="padding-top: 110px;">
    <section class="products-grid" id="productsContainer"></section>
  </main>

  <footer class="app-footer">
    <div class="footer-socials">
      <a href="#" class="social-icon" data-social="whatsapp" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2z"/></svg>
      </a>
      <a href="#" class="social-icon" data-social="instagram" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23C2.21 15.58 2.2 15.2 2.2 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.21 8.8 2.2 12 2.2z"/></svg>
      </a>
      <a href="#" class="social-icon" data-social="facebook" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.9h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg>
      </a>
      <a href="#" class="social-icon" data-social="youtube" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.5a3.02 3.02 0 00-2.12-2.14C19.5 3.85 12 3.85 12 3.85s-7.5 0-9.38.51A3.02 3.02 0 00.5 6.5C0 8.4 0 12 0 12s0 3.6.5 5.5a3.02 3.02 0 002.12 2.14c1.88.51 9.38.51 9.38.51s7.5 0 9.38-.51a3.02 3.02 0 002.12-2.14C24 15.6 24 12 24 12s0-3.6-.5-5.5zM9.6 15.6V8.4l6.24 3.6-6.24 3.6z"/></svg>
      </a>
      <a href="#" class="social-icon" data-social="meesho" aria-label="Meesho">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.5 14.5v-9l7 4.5-7 4.5z"/></svg>
      </a>
      <a href="#" class="social-icon" data-social="email" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>
    <div class="footer-copy">© Mom's Choice · A Mom's Choice Company</div>
  </footer>

  <!-- CART DRAWER -->
  <div class="cart-overlay" id="cartOverlay">
    <aside class="cart-drawer">
      <div class="cart-header">
        <h3 data-i18n="shopping_bag">Your Shopping Bag</h3>
        <button class="close-btn" id="cartCloseBtn">&times;</button>
      </div>

      <div class="cart-body" id="cartItemsList">
        <p class="empty-msg">Your shopping bag is empty.</p>
      </div>

      <div class="cart-footer">
        <div class="cart-total-row"><span data-i18n="subtotal">Subtotal</span><strong id="cartSubtotalDisplay">₹0</strong></div>
        <div class="cart-total-row"><span data-i18n="shipping">Shipping</span><strong id="cartShippingDisplay">—</strong></div>
        <div class="cart-total-row grand"><span data-i18n="grand_total">Grand Total</span><strong id="cartTotalDisplay">₹0</strong></div>

        <div class="checkout-fields">
          <input type="text" id="custName" placeholder="Full Name" data-i18n="full_name" required>
          <input type="tel" id="custPhone" placeholder="WhatsApp Number" data-i18n="phone" required>
          <input type="text" id="custHouse" placeholder="Flat / House No / Street" data-i18n="house" required>
          <input type="text" id="custArea" placeholder="Area / Locality" data-i18n="area" required>
          <input type="text" id="custDistrict" placeholder="District" data-i18n="district" required>
          <input type="text" id="custState" placeholder="State" data-i18n="state" required>
          <input type="tel" id="custPincode" placeholder="Pincode (6 digits)" data-i18n="pincode" maxlength="6" pattern="[0-9]{6}">
          <label class="save-checkbox">
            <input type="checkbox" id="saveDetails"> <span data-i18n="save_details">Save details for next order</span>
          </label>
        </div>

        <button class="btn-checkout" id="checkoutBtn" data-i18n="checkout_wa">📲 Send Order on WhatsApp</button>
      </div>
    </aside>
  </div>






  <script src="assets/js/translations.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/category.js"></script>
  <script>
    function goToFirstCategoryFromCategory(e) {
      if (e) e.preventDefault();
      if (typeof products !== 'undefined' && products.length > 0) {
        const firstCat = products[0].category;
        window.location.href = 'category.html?cat=' + encodeURIComponent(firstCat);
      } else {
        window.location.href = 'category.html?cat=Sarees'; // Fallback
      }
    }
  </script>
</body>
</html>
