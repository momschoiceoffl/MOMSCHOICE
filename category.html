<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Category | Mom's Choice</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14050B">
  <style>
    .cart-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-gold-soft); }
    .cart-header h3 { margin: 0; font-size: 1.1rem; color: var(--gold-glow); }
    .close-cart-btn { 
      background: rgba(255,255,255,0.1); 
      border: 1px solid var(--border-gold-soft); 
      color: var(--text); 
      padding: 6px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 0.8rem; 
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .close-cart-btn:hover { background: rgba(217,160,139,0.2); border-color: var(--gold-glow); color: var(--gold-glow); }
  </style>
</head>
<body>

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <strong data-i18n="store_name">Mom's Choice</strong>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link">
        <img class="nav-icon" src="assets/icons/home.svg" alt="">
        <span data-i18n="home">Home</span>
      </a>
      <a href="#" class="sidebar-link active" id="sidebarCategoriesToggle" onclick="toggleSidebarCategories(event)">
        <img class="nav-icon" src="assets/icons/categories.svg" alt="">
        <span data-i18n="categories">Categories</span>
      </a>
      <div class="sidebar-subnav" id="sidebarSubnav" style="display:none;"></div>
      
      <div style="border-top:1px solid rgba(255,255,255,0.1);margin:10px 0;"></div>
      
      <a href="#" class="sidebar-link" onclick="openFavsModal()">
        <img class="nav-icon" src="assets/icons/heart.svg" alt="">
        <span data-i18n="favorites">Favorites</span>
      </a>
      <a href="#" class="sidebar-link" onclick="openWishModal()">
        <img class="nav-icon" src="assets/icons/bookmark.svg" alt="">
        <span data-i18n="wishlist">Wishlist</span>
      </a>
      <a href="#" class="sidebar-link" onclick="shareStore()">
        <img class="nav-icon" src="assets/icons/share.svg" alt="">
        <span data-i18n="share_store">Share Store</span>
      </a>
    </nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header class="app-header">
    <div class="header-left-group">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
      <div class="brand">
        <img src="https://res.cloudinary.com/ft8zlz5x/image/upload/v1793235967/moms_pick/logo/MOMS%20CHOICE.png" alt="Mom's Choice" class="brand-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <img class="logo-icon-fallback" src="assets/icons/sparkle.svg" alt="">
        <div>
          <h1 id="catPageTitle">Category</h1>
          <small><span>Ethnic Wardrobe</span><span>Jewels &amp; Accessories</span></small>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <div class="header-stack">
        <div class="top-row">
          <div style="display:flex;background:rgba(0,0,0,0.4);border:1px solid var(--border-gold);border-radius:16px;overflow:hidden;">
            <button onclick="setLanguage('en')" id="btnLangEn" style="font-size:0.75rem;font-weight:700;padding:4px 10px;border:none;cursor:pointer;">EN</button>
            <button onclick="setLanguage('ta')" id="btnLangTa" style="font-size:0.75rem;font-weight:700;padding:4px 10px;border:none;cursor:pointer;">தமிழ்</button>
          </div>
        </div>
        <div class="bottom-row">
          <button class="icon-btn" id="searchToggle" aria-label="Search">
            <img src="assets/icons/search.svg" width="20" height="20" alt="">
          </button>
          <button class="cart-trigger" id="cartOpenBtn" aria-label="Shopping Cart">
            <img src="assets/icons/cart.svg" width="18" height="18" alt="">
            <span class="cart-counter" id="cartCount">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ═══════════════ SEARCH BAR ═══════════════ -->
  <div class="search-bar" id="searchBar">
    <input type="search" id="searchInput" placeholder="Search this category..." data-i18n="search_cat_placeholder" autocomplete="off">
    <button class="search-close" id="searchClose" style="font-size:1.2rem;color:var(--text-muted);">&times;</button>
  </div>

  <!-- ═══════════════ STICKY CHIPS ═══════════════ -->
  <div class="sticky-chips-wrap">
    <div class="sticky-inner">
      <button class="sub-btn back-btn" id="catBackBtn" onclick="window.location.href='index.html'">← Home</button>
      <div class="subcategory-bar" id="subcategoryBar"></div>
    </div>
  </div>

  <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
  <main class="container" style="padding-top:130px;">
    <section class="products-grid" id="productsContainer"></section>
  </main>

  <!-- ═══════════════ FOOTER ═══════════════ -->
  <footer class="app-footer">
    <div class="footer-socials">
      <a href="#" class="social-icon" data-social="whatsapp" aria-label="WhatsApp"><img src="assets/icons/whatsapp.svg" alt=""></a>
      <a href="https://www.instagram.com/momschoiceoffl/" target="_blank" class="social-icon" data-social="instagram" aria-label="Instagram"><img src="assets/icons/instagram.svg" alt=""></a>
      <a href="https://www.facebook.com/momschoiceoffl/" target="_blank" class="social-icon" data-social="facebook" aria-label="Facebook"><img src="assets/icons/facebook.svg" alt=""></a>
      <a href="https://www.youtube.com/@momschoiceoffl" target="_blank" class="social-icon" data-social="youtube" aria-label="YouTube"><img src="assets/icons/youtube.svg" alt=""></a>
      <a href="https://www.meesho.com/momschoiceoffl" target="_blank" class="social-icon" data-social="meesho" aria-label="Meesho"><img src="assets/icons/meesho.svg" alt=""></a>
      <a href="#" class="social-icon" data-social="email" aria-label="Email"><img src="assets/icons/email.svg" alt=""></a>
    </div>
    <div class="footer-copy">© Mom's Choice · A Mom's Choice Company</div>
  </footer>

  <!-- ═══════════════ CART DRAWER ═══════════════ -->
  <div class="cart-overlay" id="cartOverlay">
    <aside class="cart-drawer">
      <div class="cart-header">
        <h3 data-i18n="shopping_bag">Your Shopping Bag</h3>
        <button class="close-cart-btn" id="cartCloseBtn" aria-label="Close cart" style="display: flex !important; background: #6B0F2E; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; align-items: center; gap: 6px; cursor: pointer; z-index: 9999;">
          <img src="assets/icons/close.svg" width="18" height="18" alt="" style="filter: brightness(0) invert(1);"> Close
        </button>
      </div>
      <div class="cart-body" id="cartItemsList">
        <p class="empty-msg" data-i18n="empty_bag">Your shopping bag is empty.</p>
      </div>
      <div class="cart-footer">
        <div class="cart-total-row"><span data-i18n="subtotal">Subtotal</span><strong id="cartSubtotalDisplay">₹0</strong></div>
        <div class="cart-total-row"><span data-i18n="shipping">Shipping</span><strong id="cartShippingDisplay">—</strong></div>
        <div class="cart-total-row grand"><span data-i18n="grand_total">Grand Total</span><strong id="cartTotalDisplay">₹0</strong></div>
        <div class="checkout-fields">
          <input type="text" id="custName" placeholder="Full Name" data-i18n="full_name" required>
          <input type="tel" id="custPhone" placeholder="WhatsApp Number" data-i18n="phone" required>
          <input type="text" id="custHouse" placeholder="Flat / House No / Street" data-i18n="house" required>
          <input type="text" id="custArea" placeholder="Area / Locality" data-i18n="area" required>
          <input type="text" id="custDistrict" placeholder="District" data-i18n="district" required>
          <input type="text" id="custState" placeholder="State" data-i18n="state" required>
          <input type="tel" id="custPincode" placeholder="Pincode (6 digits)" data-i18n="pincode" maxlength="6" pattern="[0-9]{6}">
          <label class="save-checkbox"><input type="checkbox" id="saveDetails"> <span data-i18n="save_details">Save details for next order</span></label>
        </div>
        <button class="btn-checkout" id="checkoutBtn" data-i18n="checkout_wa">📲 Send Order on WhatsApp</button>
      </div>
    </aside>
  </div>

  <!-- ═══════════════ FAVORITES / WISHLIST MODAL ═══════════════ -->
  <div class="login-modal-overlay" id="favsModal">
    <div class="login-card" style="max-width:90%;width:500px;text-align:left; position: relative;">
      <button class="close-btn" onclick="document.getElementById('favsModal').classList.remove('open')" style="position:absolute; top:16px; right:16px; cursor:pointer; background:none; border:none;">
        <img src="assets/icons/close.svg" width="20" height="20" alt="">
      </button>
      <h2 id="favsModalTitle" style="margin-bottom:12px;">My Items</h2>
      <div id="favsModalList" style="max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;"></div>
    </div>
  </div>

  <script src="assets/js/translations.js"></script>
  <script src="assets/js/category.js"></script>
</body>
</html>
