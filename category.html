<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Category | Mom's Choice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14050B">
<style>
:root{
--primary:#6B0F2E;--primary-deep:#4A0A20;--primary-bright:#9C1A45;--gold-glow:#D9A08B;
--gold-metal:linear-gradient(135deg,#F2C4B3 0%,#D9A08B 35%,#B87A62 70%,#D9A08B 100%);
--bg:#14050B;--text:#FDF8F9;--text-muted:#C2A5B0;
--border-gold:rgba(217,160,139,.5);--border-gold-soft:rgba(217,160,139,.2);
--wa-green:#25d366;--radius:16px;--radius-lg:20px;--shadow-card:0 6px 20px rgba(0,0,0,.4);
--gap:clamp(8px,1.5vw,16px);--pad-card:clamp(8px,1.5vw,12px);
--fs-title:clamp(.85rem,2.4vw,1.15rem);--fs-h4:clamp(.72rem,1.9vw,.95rem);
--fs-price:clamp(.85rem,2.2vw,1.1rem);--fs-btn:clamp(.7rem,1.8vw,.8rem);
--fs-small:clamp(.6rem,1.5vw,.75rem);--fs-badge:clamp(.5rem,1.3vw,.65rem);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{background:var(--bg);background-image:radial-gradient(ellipse at 50% 30%,rgba(107,15,46,.3) 0%,transparent 55%),radial-gradient(ellipse at 50% 100%,rgba(36,10,20,.6) 0%,transparent 60%);background-attachment:fixed;color:var(--text);padding-top:75px;padding-bottom:clamp(20px,4vw,40px);min-height:100vh}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.sidebar{position:fixed;top:0;left:0;width:min(260px,78vw);height:100%;background:rgba(20,5,11,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-right:1px solid var(--border-gold-soft);transform:translateX(-100%);transition:transform .25s ease;z-index:250;box-shadow:6px 0 30px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow-y:auto}
.sidebar.open{transform:translateX(0)}
.sidebar-head{padding:18px 20px;padding-top:75px;border-bottom:1px solid var(--border-gold-soft);display:flex;align-items:center;gap:10px;font-size:1.05rem;color:var(--gold-glow)}
.sidebar-nav{display:flex;flex-direction:column;padding:12px 0}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:13px 20px;color:var(--text);font-size:.9rem;font-weight:600;border-left:3px solid transparent;transition:background .15s,border-color .15s;cursor:pointer}
.sidebar-link:hover,.sidebar-link.active{background:rgba(217,160,139,.08);color:var(--gold-glow);border-left-color:var(--gold-glow)}
.sidebar-link .nav-icon{width:20px;height:20px;flex-shrink:0}
.sidebar-subnav{display:none;flex-direction:column;background:rgba(0,0,0,.3);border-left:3px solid var(--gold-glow);padding:4px 0}
.sidebar-subnav.open{display:flex}
.sidebar-sublink{padding:9px 20px 9px 40px;color:var(--text-muted);font-size:.8rem;font-weight:500;transition:background .15s,color .15s;display:block}
.sidebar-sublink:hover{background:rgba(217,160,139,.1);color:var(--gold-glow)}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:240;opacity:0;pointer-events:none;transition:opacity .25s}
.sidebar-backdrop.open{opacity:1;pointer-events:auto}
.app-header{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(20,5,11,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--border-gold-soft);padding:8px clamp(10px,2vw,16px);display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.4);height:75px}
.header-left-group{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.hamburger{background:none;border:none;font-size:1.5rem;color:var(--gold-glow);cursor:pointer;padding:2px 6px;line-height:1;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand-logo{height:clamp(40px,8vw,55px);max-height:55px;width:auto;object-fit:contain;border-radius:8px;flex-shrink:0;background:rgba(0,0,0,.3);border:1px solid var(--border-gold)}
.logo-icon-fallback{display:none;width:clamp(40px,8vw,55px);height:clamp(40px,8vw,55px);align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.brand h1{font-size:calc(var(--fs-title)*1.35);line-height:1.1;margin-bottom:3px;letter-spacing:.5px;background:var(--gold-metal);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShimmer 6s linear infinite;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes goldShimmer{0%{background-position:0% center}100%{background-position:200% center}}
.brand small{font-size:var(--fs-small);color:var(--text-muted);display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small span{display:block}
.header-actions{display:flex;align-items:center;gap:clamp(4px,1vw,12px);flex-shrink:0}
.header-stack{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.header-stack .top-row{display:flex;gap:6px;align-items:center}
.header-stack .bottom-row{display:flex;gap:8px;align-items:center;justify-content:flex-end}
#btnLangEn,#btnLangTa{font-size:.72rem;font-weight:700;padding:4px 10px;border:none;cursor:pointer;background:transparent;color:var(--text-muted);transition:background .2s,color .2s}
#btnLangEn.active,#btnLangTa.active{background:#F1F0E2;color:#14050B}
.icon-btn{background:rgba(0,0,0,.4);border:1px solid var(--border-gold);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--gold-glow);cursor:pointer}
.cart-trigger{position:relative;background:rgba(0,0,0,.4);border:1px solid var(--border-gold);border-radius:20px;padding:5px 11px;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--gold-glow);font-weight:700;font-size:.85rem}
.cart-counter{background:var(--gold-glow);color:var(--bg);border-radius:50%;font-size:.66rem;width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-weight:800}
.search-bar{position:fixed;top:75px;left:0;right:0;z-index:105;background:rgba(20,5,11,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border-gold-soft);padding:0 14px;display:flex;gap:8px;align-items:center;max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,padding .25s ease,opacity .2s ease}
.search-bar.open{max-height:60px;padding:10px 14px;opacity:1}
.search-bar input{flex:1;padding:10px 14px;border:1px solid var(--border-gold-soft);border-radius:10px;font-size:.9rem;background:rgba(0,0,0,.4);color:var(--text);outline:none}
.search-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-muted);padding:0 8px}
.sticky-chips-wrap{position:fixed;top:75px;left:0;right:0;z-index:104;background:var(--bg);border-bottom:1px solid var(--border-gold-soft);display:flex;justify-content:center;line-height:1;transition:top .25s ease}
.search-bar.open~.sticky-chips-wrap{top:135px}
.sticky-inner{width:100%;max-width:900px;padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.subcategory-bar{display:flex;overflow-x:auto;gap:8px;scrollbar-width:none;padding-bottom:0;margin-bottom:0;flex:1;align-items:center}
.subcategory-bar::-webkit-scrollbar{display:none}
.sub-btn,.back-btn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 16px;font-size:.85rem;font-weight:600;line-height:1;white-space:nowrap;border-radius:20px;border:1px solid var(--border-gold-soft);background:rgba(36,10,20,.5);color:var(--text);cursor:pointer;transition:all .2s ease;box-sizing:border-box;margin:0;flex-shrink:0}
.sub-btn:hover,.back-btn:hover{background:rgba(217,160,139,.15);border-color:var(--primary-bright)}
.sub-btn.active{background:var(--gold-metal);color:var(--bg);border-color:var(--primary-bright);font-weight:800}
.container{max-width:900px;margin:0 auto;padding:clamp(10px,2vw,16px)}
.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);padding-bottom:40px}
@media(max-width:480px){.products-grid{grid-template-columns:repeat(2,1fr)}}
.product-card{background:rgba(36,10,20,.35);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--border-gold);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:transform .4s ease,box-shadow .4s ease,border-color .4s ease;box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.3),0 0 0 1px rgba(217,160,139,.15);position:relative}
.product-card:hover{transform:translateY(-6px);border-color:rgba(217,160,139,.9);box-shadow:0 14px 40px rgba(0,0,0,.75),0 0 50px rgba(217,160,139,.35),0 0 100px rgba(217,160,139,.15),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.4),0 0 0 1px rgba(217,160,139,.6)}
.img-box{position:relative;width:100%;padding-top:100%;cursor:pointer;background:rgba(0,0,0,.3)}
.img-box img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.product-badge{position:absolute;top:8px;left:8px;background:var(--gold-metal);background-size:200% auto;color:var(--bg);font-size:var(--fs-badge);padding:4px 9px;border-radius:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:3;animation:badgeChrome 3s linear infinite}
@keyframes badgeChrome{0%{background-position:0% center}100%{background-position:200% center}}
.product-info{padding:var(--pad-card);flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.product-info h4{font-size:var(--fs-h4);margin-bottom:8px;color:var(--text);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.current-price{font-size:var(--fs-price);font-weight:800;color:var(--gold-glow);text-shadow:0 0 12px rgba(217,160,139,.5),0 1px 2px rgba(0,0,0,.5)}
.mrp-price{font-size:var(--fs-small);text-decoration:line-through;color:rgba(253,248,249,.5)}
.product-actions-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.action-icon-btn{background:rgba(0,0,0,.4);border:1px solid var(--border-gold-soft);color:var(--gold-glow);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s ease}
.action-icon-btn svg{width:18px;height:18px;fill:currentColor;transition:transform .2s ease}
.action-icon-btn:hover svg{transform:scale(1.1)}
.action-icon-btn:hover{background:rgba(217,160,139,.2);border-color:var(--gold-glow);transform:translateY(-2px)}
.action-icon-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-add{background:var(--gold-metal);background-size:200% auto;color:var(--bg);border:none;width:100%;padding:clamp(8px,1.5vw,10px);border-radius:8px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;font-size:var(--fs-btn);cursor:pointer;transition:transform .2s,box-shadow .2s,background-position .4s;box-shadow:0 3px 14px rgba(217,160,139,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(217,160,139,.6);background-position:right center}
.btn-wa-card{background:var(--wa-green);color:#fff;border:none;width:100%;padding:clamp(7px,1.4vw,9px);border-radius:8px;font-weight:700;font-size:var(--fs-btn);letter-spacing:.3px;cursor:pointer;margin-top:6px;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 10px rgba(37,211,102,.25)}
.btn-wa-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-card)}
.empty-msg{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 0;font-size:.95rem}
.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;justify-content:flex-end}
.cart-overlay.open{display:flex}
.cart-drawer{background:rgba(20,5,11,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);width:100%;max-width:400px;height:100%;display:flex;flex-direction:column;border-left:1px solid var(--border-gold);box-shadow:-10px 0 40px rgba(0,0,0,.75)}
.cart-header{padding:16px;border-bottom:1px solid var(--border-gold-soft);display:flex;justify-content:flex-start;align-items:center;gap:12px}
.cart-header h3{color:var(--gold-glow);font-size:1.1rem;margin:0}
.close-btn{background:none;border:none;color:var(--gold-glow);cursor:pointer;display:flex;padding:4px}
.close-btn svg{display:block;transition:transform .2s ease}
.close-btn:hover svg{transform:scale(1.1) rotate(90deg)}
.cart-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}
.cart-body .empty-msg{margin-top:auto;padding-bottom:20px;text-align:center}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--border-gold-soft);padding-bottom:8px;color:var(--text)}
.cart-item strong{font-size:.85rem;display:block;margin-bottom:3px}
.cart-item .rm{background:none;border:none;color:red;cursor:pointer;font-size:1rem}
.cart-footer{padding:16px;border-top:1px solid var(--border-gold-soft)}
.cart-total-row{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px;color:var(--text);font-weight:500}
.cart-total-row.grand{font-size:1.05rem;color:var(--gold-glow);font-weight:800;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-gold-soft);margin-bottom:12px}
.checkout-fields input,.checkout-fields textarea{width:100%;padding:10px;margin-bottom:8px;border:1px solid var(--border-gold-soft);border-radius:8px;font-size:.88rem;background:rgba(0,0,0,.4);color:var(--text);outline:none}
.save-checkbox{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.8rem;color:var(--text-muted);cursor:pointer;user-select:none}
.save-checkbox input[type="checkbox"]{width:auto;margin:0;padding:0;accent-color:var(--gold-glow);cursor:pointer}
.btn-checkout{width:100%;padding:12px;background:var(--wa-green);color:#fff;border:none;border-radius:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:.88rem;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 12px rgba(37,211,102,.3)}
.btn-checkout:hover{transform:translateY(-1px);box-shadow:var(--shadow-card)}
.login-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:400;align-items:center;justify-content:center;padding:16px}
.login-modal-overlay.open{display:flex}
.login-card{background:rgba(20,5,11,.95);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-radius:var(--radius);max-width:90%;width:500px;text-align:left;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 40px rgba(217,160,139,.2);border:1px solid var(--border-gold)}
.login-card h2{font-size:1.15rem;color:var(--gold-glow);margin-bottom:12px}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text);font-size:1.4rem;cursor:pointer;line-height:1}
.modal-item{display:flex;gap:12px;text-decoration:none;color:inherit;background:rgba(255,255,255,.05);padding:10px;border-radius:8px;align-items:center;border:1px solid var(--border-gold-soft);margin-bottom:10px}
.modal-item img{width:60px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0}
.modal-item h4{font-size:.9rem;margin-bottom:4px;color:var(--text);line-height:1.25}
.modal-item .modal-price{color:var(--gold-glow);font-weight:700;font-size:.9rem}
.modal-empty{color:var(--text-muted);text-align:center;padding:20px 0}
.app-footer{margin-top:clamp(24px,4vw,40px);padding:24px 16px 90px;background:rgba(20,5,11,.7);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--border-gold-soft);text-align:center}
.footer-socials{display:flex;justify-content:center;gap:clamp(10px,2vw,18px);margin-bottom:12px;flex-wrap:wrap}
.social-icon{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--border-gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold-glow);transition:transform .2s,box-shadow .2s,background .2s}
.social-icon svg{width:55%;height:55%;display:block}
.social-icon:hover{transform:translateY(-3px);background:rgba(217,160,139,.2);box-shadow:0 6px 20px rgba(217,160,139,.3)}
.footer-copy{font-size:.75rem;color:var(--text-muted);letter-spacing:1px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:rgba(20,5,11,.98);color:var(--gold-glow);border:1px solid var(--border-gold);padding:12px 20px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:500;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .3s ease;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.brand h1{font-size:1rem}.brand small{font-size:.62rem}.sticky-chips-wrap .sticky-inner{padding-top:4px;padding-bottom:8px}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
<div class="sidebar-head"><strong data-i18n="store_name">Mom's Choice</strong></div>
<nav class="sidebar-nav">

</aside>

<div>
<h1 id="catPageTitle">Category</h1>

</div>
</div>
</div>
<div class="header-actions">
<div class="header-stack">

<div style="display:flex;background:rgba(0,0,0,.4);border:1px solid var(--border-gold);border-radius:16px;overflow:hidden">
<button onclick="setLanguage('en')" id="btnLangEn">EN</button>
<button onclick="setLanguage('ta')" id="btnLangTa">தமிழ்</button>
</div>
