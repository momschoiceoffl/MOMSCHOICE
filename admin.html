<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mom's Pick - Seller Admin</title>
  <style>
    :root { --primary: #92400e; --surface: #fff; --bg: #f8fafc; --border: #e2e8f0; --text: #0f172a; --muted: #64748b; --accent: #d97706; --success: #16a34a; --danger: #dc2626; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }
    .top-nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-links { display: flex; gap: 5px; }
    .nav-btn { background: none; border: none; padding: 20px; font-size: 0.9rem; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
    .nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .main-container { padding: 24px; max-width: 1000px; margin: 0 auto; width: 100%; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    h2 { font-size: 1.2rem; color: var(--primary); margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; }
    .row { display: flex; gap: 16px; }
    .row > div { flex: 1; }
    .btn { padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; background: var(--primary); color: #fff; }
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, 90px); gap: 10px; padding: 15px; border: 2px dashed var(--border); border-radius: 10px; margin-bottom: 16px; }
    .preview-item { aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .stat-card { background: var(--surface); padding: 20px; border-radius: 12px; border-left: 4px solid var(--primary); }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div style="padding: 15px 0;"><h2 style="margin:0;">Mom's Pick Admin</h2></div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="switchTab('add-product', this)">➕ Add / Scan Product</button>
      <button class="nav-btn" onclick="switchTab('invoices', this)">🧾 Create Bill</button>
    </div>
  </nav>

  <div class="main-container">
    
    <!-- TAB 1: ADD PRODUCT -->
    <div id="tab-add-product" class="tab-content active">
      <div class="card">
        <h2>Add New Stock</h2>
        <div class="preview-grid" id="previewGrid"></div>
        <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelection(event)">

        <div class="row">
          <div><label>Product ID</label><input type="text" id="pId" placeholder="Scan QR or type ID"></div>
          <div><label>Category</label><input type="text" id="pCat" placeholder="Sarees"></div>
          <div><label>Subcategory</label><input type="text" id="pSubCat" placeholder="Silk"></div>
        </div>
        <div class="row">
          <div><label>Purchase Rate (₹) - Private</label><input type="number" id="pCost" placeholder="e.g. 350"></div>
          <div><label>Actual Selling Price (₹)</label><input type="number" id="pPrice" placeholder="e.g. 599"></div>
          <div><label>Crossed MRP (₹)</label><input type="number" id="pMrp" placeholder="e.g. 999"></div>
        </div>
        <div class="row">
          <div><label>Title (English)</label><input type="text" id="pTitle"></div>
          <div><label>Title (Tamil)</label><input type="text" id="pTitleTa"></div>
        </div>
        <label>Description (English)</label>
        <textarea id="pDesc" rows="2"></textarea>
        <label>Description (Tamil)</label>
        <textarea id="pDescTa" rows="2"></textarea>

        <button class="btn" onclick="saveProduct()">Save to Google Sheet</button>
      </div>
    </div>

    <!-- TAB 2: INVOICE -->
    <div id="tab-invoices" class="tab-content">
      <div class="card" style="background: #fef3c7; border-color: #fde68a;">
        <h2>🧾 Scan & Bill</h2>
        <p style="color: #b45309; margin-bottom: 16px;">Scan the QR code on the saree packet to auto-fill the bill.</p>
        
        <div class="row">
          <div style="flex: 2;">
            <label>Scan QR / Enter Product ID</label>
            <input type="text" id="invSearchInput" placeholder="Scan here..." onkeypress="if(event.key==='Enter') promptInvoiceDetails()">
          </div>
          <div style="flex: 1; padding-top: 24px;">
            <button class="btn" style="background: #d97706;" onclick="promptInvoiceDetails()">Find & Bill</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentImageFiles = [];

    function switchTab(tabId, btnEl) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      btnEl.classList.add('active');
    }

    function handleImageSelection(event) {
      const files = Array.from(event.target.files || []);
      files.forEach(f => currentImageFiles.push(f));
      document.getElementById("previewGrid").innerHTML = currentImageFiles.map((file, i) => `
        <div class="preview-item"><img src="${URL.createObjectURL(file)}"></div>
      `).join("");
    }

    async function saveProduct() {
      const id = document.getElementById("pId").value.trim();
      const title = document.getElementById("pTitle").value.trim();
      const price = Number(document.getElementById("pPrice").value);
      
      if (!id || !title || !price) return alert("Please fill ID, Title, and Selling Price.");

      const btn = document.querySelector("#tab-add-product .btn");
      btn.innerText = "Uploading Images...";
      
      let imageUrl = "";
      if (currentImageFiles.length > 0) {
        const form = new FormData();
        currentImageFiles.forEach(f => form.append("file", f));
        form.append("category", document.getElementById("pCat").value || "Uncategorized");
        
        const upRes = await fetch("http://localhost:5000/upload", { method: "POST", body: form });
        const upData = await upRes.json();
        if (upData.ok) imageUrl = upData.url;
      }

      const product = {
        id: id,
        category: document.getElementById("pCat").value,
        subcategory: document.getElementById("pSubCat").value,
        purchaseRate: Number(document.getElementById("pCost").value) || 0,
        price: price,
        originalPrice: Number(document.getElementById("pMrp").value) || price,
        title: title,
        title_ta: document.getElementById("pTitleTa").value,
        description: document.getElementById("pDesc").value,
        description_ta: document.getElementById("pDescTa").value,
        image: imageUrl
      };

      btn.innerText = "Saving to Google Sheet...";
      await fetch("http://localhost:5000/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(product)
      });

      btn.innerText = "✅ Saved!";
      setTimeout(() => { btn.innerText = "Save to Google Sheet"; resetForm(); }, 1500);
    }

    function resetForm() {
      document.querySelectorAll("#tab-add-product input, #tab-add-product textarea").forEach(el => el.value = "");
      document.getElementById("previewGrid").innerHTML = "";
      currentImageFiles = [];
    }

    async function promptInvoiceDetails() {
      const query = document.getElementById("invSearchInput").value.trim().toLowerCase();
      if (!query) return alert("Please scan or enter a Product ID");

      // Fetch live data from Google Sheets via Python
      const res = await fetch("http://localhost:5000/get-products");
      const products = await res.json();
      
      const product = products.find(p => p.id.toLowerCase() === query);
      if (!product) return alert("❌ Product not found in database!");

      const custName = prompt(`Found: ${product.title}\n\nEnter Customer Name:`);
      if (!custName) return;
      const custPhone = prompt("Enter Customer Phone:");
      const custAddress = prompt("Enter Customer Address:");

      // Send to invoice.html
      const url = `invoice.html?id=${encodeURIComponent(product.id)}` +
                  `&title=${encodeURIComponent(product.title)}` +
                  `&price=${product.price}` +
                  `&qty=1` +
                  `&cName=${encodeURIComponent(custName)}` +
                  `&cPhone=${encodeURIComponent(custPhone || "")}` +
                  `&cAddr=${encodeURIComponent(custAddress || "")}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
