<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mom's Choice</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d97706">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <strong data-i18n="store_name">Mom's Choice</strong>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link active">
        <img class="nav-icon" src="assets/icons/home.svg" alt=""> <span data-i18n="home">Home</span>
      </a>
      <a href="#" class="sidebar-link" id="sidebarCategoriesToggle" onclick="toggleSidebarCategories(event)">
        <img class="nav-icon" src="assets/icons/categories.svg" alt=""> <span data-i18n="categories">Categories</span>
      </a>
      <div class="sidebar-subnav" id="sidebarSubnav" style="display: none;"></div>
      
      <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;"></div>
      
      <a href="#" class="sidebar-link" onclick="openFavsModal()">
        <img class="nav-icon" src="assets/icons/heart.svg" alt=""> <span data-i18n="favorites">Favorites</span>
      </a>
      <a href="#" class="sidebar-link" onclick="openWishModal()">
        <img class="nav-icon" src="assets/icons/bookmark.svg" alt=""> <span data-i18n="wishlist">Wishlist</span>
      </a>
      <a href="#" class="sidebar-link" onclick="shareStore()">
        <img class="nav-icon" src="assets/icons/share.svg" alt=""> <span data-i18n="share_store">Share Store</span>
      </a>
    </nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="document.getElementById('sidebar').classList.remove('open'); this.classList.remove('open');"></div>

  <header class="app-header">
    <div class="header-left-group">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menu" onclick="document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('open');">☰</button>
      <div class="brand">
        <img src="https://res.cloudinary.com/ft8zlz5x/image/upload/v1793237123/moms_pick/logo/MOMS%20CHOICE.png" alt="Mom's Choice" class="brand-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="logo-icon-fallback">✨</span>
        <div>
          <h1>Mom's Choice</h1>
          <small><span>Ethnic Wardrobe</span><span>Jewels & Accessories</span></small>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <div class="header-stack">
        <div class="top-row">
          <div style="display: flex; background: rgba(0,0,0,0.4); border: 1px solid var(--border-gold); border-radius: 16px; overflow: hidden;">
            <button onclick="setLanguage('en')" id="btnLangEn" style="font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border: none; cursor: pointer;">EN</button>
            <button onclick="setLanguage('ta')" id="btnLangTa" style="font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border: none; cursor: pointer;">தமிழ்</button>
          </div>
        </div>
        <div class="bottom-row">
          <button class="icon-btn" id="searchToggle" aria-label="Search">
            <img src="assets/icons/search.svg" width="20" height="20" alt="">
          </button>
          <button class="cart-trigger" id="cartOpenBtn" aria-label="Shopping Cart">
            <img src="assets/icons/cart.svg" width="18" height="18" alt="">
            <span class="cart-counter" id="cartCount">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="search-bar" id="searchBar">
    <input type="search" id="searchInput" placeholder="Search products..." data-i18n="search_placeholder" autocomplete="off">
    <button class="search-close" id="searchClose" style="font-size: 1.2rem; color: var(--text-muted);">&times;</button>
  </div>

  <main class="container">
    <div class="subcategory-bar" id="subcategoryBar"></div>

    <section class="hero-carousel" id="heroCarousel" aria-label="Featured products">
      <div class="hero-col hero-col-carousel">
        <div class="carousel-track" id="carouselTrack">
          <div class="carousel-loading">Loading…</div>
        </div>
        <div class="carousel-dots" id="carouselDots" aria-label="Slide navigation"></div>
      </div>
    </section>

    <section class="category-cards" id="categoryCards">
      <h2 class="section-title" data-i18n="shop_by_category">Shop by Category</h2>
      <div class="category-grid" id="categoryGrid"></div>
    </section>
  </main>

  <div class="cart-overlay" id="cartOverlay">
    <aside class="cart-drawer">
      <div class="cart-header">
        <h3 data-i18n="shopping_bag" style="margin: 0;">Your Shopping Bag</h3>
        <button class="close-cart-btn" id="cartCloseBtn" aria-label="Close cart" style="display: flex !important; background: #6B0F2E; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; align-items: center; gap: 6px; cursor: pointer; z-index: 9999;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg> Close
        </button>
      </div>

      <div class="cart-body" id="cartItemsList">
        <p class="empty-msg">Your shopping bag is empty.</p>
      </div>

      <button onclick="document.getElementById('cartOverlay').classList.remove('open')" style="position: absolute; bottom: 20px; left: 20px; background: #6B0F2E; color: #fff; border: 2px solid #D9A08B; padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer; z-index: 99999; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.8);">
        ✕ Close Cart
      </button>
      <div class="cart-footer">
        <div class="cart-total-row"><span data-i18n="subtotal">Subtotal</span><strong id="cartSubtotalDisplay">₹0</strong></div>
        <div class="cart-total-row"><span data-i18n="shipping">Shipping</span><strong id="cartShippingDisplay">—</strong></div>
        <div class="cart-total-row grand"><span data-i18n="grand_total">Grand Total</span><strong id="cartTotalDisplay">₹0</strong></div>

        <div class="checkout-fields">
          <input type="text" id="custName" placeholder="Full Name" data-i18n="full_name" required>
          <input type="tel" id="custPhone" placeholder="WhatsApp Number" data-i18n="phone" required>
          <input type="text" id="custHouse" placeholder="Flat / House No / Street" data-i18n="house" required>
          <input type="text" id="custArea" placeholder="Area / Locality" data-i18n="area" required>
          <input type="text" id="custDistrict" placeholder="District" data-i18n="district" required>
          <input type="text" id="custState" placeholder="State" data-i18n="state" required>
          <input type="tel" id="custPincode" placeholder="Pincode (6 digits)" data-i18n="pincode" maxlength="6" pattern="[0-9]{6}">
          <label class="save-checkbox">
            <input type="checkbox" id="saveDetails"> <span data-i18n="save_details">Save details for next order</span>
          </label>
        </div>

        <button class="btn-checkout" id="checkoutBtn" data-i18n="checkout_wa">📲 Send Order on WhatsApp</button>
      </div>
    </aside>
  </div>

  <footer class="app-footer">
    <div class="footer-socials">
      <a href="#" class="social-icon" aria-label="WhatsApp" data-social="whatsapp">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.15c-1.53 0-3.03-.41-4.34-1.18l-.31-.18-3.12.82.83-3.04-.2-.32a8.24 8.24 0 01-1.27-4.36c0-4.54 3.7-8.24 8.24-8.24s8.24 3.7 8.24 8.24-3.7 8.24-8.24 8.24zm4.52-6.17c-.25-.12-1.47-.72-1.7-.8-.23-.08-.4-.12-.57.12-.17.25-.65.8-.8.96-.15.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.12-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.57-1.37-.78-1.88-.2-.49-.41-.42-.57-.43-.15-.01-.31-.01-.48-.01-.17 0-.44.06-.66.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.57.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.2-.58.2-1.07.15-1.18-.06-.11-.23-.17-.48-.29z"/></svg>
      </a>
      <a href="https://www.instagram.com/momschoiceoffl/" target="_blank" class="social-icon" aria-label="Instagram" data-social="instagram">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23C2.21 15.58 2.2 15.2 2.2 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.21 8.8 2.2 12 2.2z"/></svg>
      </a>
      <a href="https://www.facebook.com/momschoiceoffl/" target="_blank" class="social-icon" aria-label="Facebook" data-social="facebook">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.9h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg>
      </a>
      <a href="https://www.youtube.com/@momschoiceoffl" target="_blank" class="social-icon" aria-label="YouTube" data-social="youtube">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.5a3.02 3.02 0 00-2.12-2.14C19.5 3.85 12 3.85 12 3.85s-7.5 0-9.38.51A3.02 3.02 0 00.5 6.5C0 8.4 0 12 0 12s0 3.6.5 5.5a3.02 3.02 0 002.12 2.14c1.88.51 9.38.51 9.38.51s7.5 0 9.38-.51a3.02 3.02 0 002.12-2.14C24 15.6 24 12 24 12s0-3.6-.5-5.5zM9.6 15.6V8.4l6.24 3.6-6.24 3.6z"/></svg>
      </a>
      <a href="https://www.meesho.com/momschoiceoffl" target="_blank" class="social-icon" aria-label="Meesho" data-social="meesho">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.5 14.5v-9l7 4.5-7 4.5z"/></svg>
      </a>
      <a href="#" class="social-icon" aria-label="Email" data-social="email">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </a>
    </div>
    <div class="footer-copy">© Mom's Choice · A Mom's Choice Company</div>
  </footer>

  <div class="login-modal-overlay" id="favsModal">
    <div class="login-card" style="max-width: 90%; width: 500px; text-align: left;">
      <button class="close-btn" onclick="document.getElementById('favsModal').classList.remove('open')" style="float: right; cursor: pointer;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <h2 id="favsModalTitle" style="margin-bottom: 12px;">My Items</h2>
      <div id="favsModalList" style="max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <script src="assets/js/translations.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function goToFirstCategory(e) {
      if (e) e.preventDefault();
      if (typeof products !== 'undefined' && products.length > 0) {
        const firstCat = products[0].category;
        window.location.href = 'category.html?cat=' + encodeURIComponent(firstCat);
      } else {
        window.location.href = 'category.html?cat=Sarees';
      }
    }
  </script>
</body>
</html>
