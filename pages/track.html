<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order | Mom's Choice</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta name="theme-color" content="#14050B">
  <style>
    .track-container { max-width: 500px; margin: 100px auto 40px; padding: 20px; background: rgba(36,10,20,0.6); border: 1px solid var(--border-gold); border-radius: 12px; text-align: center; }
    .track-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: var(--text); margin-bottom: 16px; outline: none; font-size: 1rem; }
    .btn-track { width: 100%; padding: 12px; background: var(--gold-metal); color: var(--bg); font-weight: 800; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; text-transform: uppercase; }
    .status-box { display: none; margin-top: 20px; padding: 16px; border-radius: 8px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-gold-soft); text-align: left; }
    .status-step { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; opacity: 0.5; }
    .status-step.active { opacity: 1; font-weight: bold; color: var(--gold-glow); }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text-muted); }
    .status-step.active .status-dot { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand" style="padding-left: 16px;">
      <div>
        <h1 style="font-size: 1.2rem;">Track Order</h1>
        <small><span>Mom's Choice</span></small>
      </div>
    </div>
    <div style="padding-right: 16px;">
      <a href="../index.html" style="color: var(--gold-glow); text-decoration: none; font-size: 0.9rem;">← Back</a>
    </div>
  </header>

  <main class="track-container">
    <h2 style="color: var(--gold-glow); margin-bottom: 8px;">Where is my order?</h2>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Enter your Invoice Number (e.g., SAR-261108-A0004)</p>
    
    <input type="text" id="trackInput" class="track-input" placeholder="Enter Invoice Number...">
    <button class="btn-track" onclick="trackOrder()">Track</button>

    <div id="statusResult" class="status-box">
      <h3 style="color: var(--text); margin-bottom: 16px; font-size: 1.1rem;">Order Status</h3>
      
      <div class="status-step active" id="step-packed">
        <div class="status-dot"></div>
        <div>Packed & Ready</div>
      </div>
      <div class="status-step" id="step-shipped">
        <div class="status-dot"></div>
        <div>Shipped (In Transit)</div>
      </div>
      <div class="status-step" id="step-delivered">
        <div class="status-dot"></div>
        <div>Delivered</div>
      </div>

      <div style="margin-top: 16px; font-size: 0.8rem; color: var(--text-muted); border-top: 1px dashed var(--border-gold-soft); padding-top: 12px;">
        If you need exact transit details, please message us on WhatsApp.
      </div>
    </div>
  </main>

  <script>
    function trackOrder() {
      const inv = document.getElementById("trackInput").value.trim().toUpperCase();
      const resultBox = document.getElementById("statusResult");
      
      if (!inv) return alert("Please enter an Invoice Number.");

      // SIMULATION LOGIC: 
      // Since you are not using a real courier API, we simulate the status based on the date in the Invoice ID.
      // Format: SAR-YYMMDD-A0001
      const match = inv.match(/[A-Z]{3}-(\d{2})(\d{2})(\d{2})-/);
      
      if (!match) {
        resultBox.style.display = "block";
        document.getElementById("step-packed").className = "status-step";
        document.getElementById("step-shipped").className = "status-step";
        document.getElementById("step-delivered").className = "status-step";
        alert("Invalid Invoice Format. It should look like SAR-261108-A0001.");
        return;
      }

      const yy = parseInt(match[1]) + 2000;
      const mm = parseInt(match[2]) - 1;
      const dd = parseInt(match[3]);
      
      const orderDate = new Date(yy, mm, dd);
      const today = new Date();
      const diffDays = Math.ceil((today - orderDate) / (1000 * 60 * 60 * 24));

      resultBox.style.display = "block";
      document.getElementById("step-packed").className = "status-step";
      document.getElementById("step-shipped").className = "status-step";
      document.getElementById("step-delivered").className = "status-step";

      if (diffDays <= 1) {
        // 0-1 days old
        document.getElementById("step-packed").classList.add("active");
      } else if (diffDays > 1 && diffDays < 5) {
        // 2-4 days old
        document.getElementById("step-packed").classList.add("active");
        document.getElementById("step-shipped").classList.add("active");
      } else {
        // 5+ days old
        document.getElementById("step-packed").classList.add("active");
        document.getElementById("step-shipped").classList.add("active");
        document.getElementById("step-delivered").classList.add("active");
      }
    }
  </script>
</body>
</html>
